# ============================================================
#  AuthDoc — Google Cloud Build CI/CD Pipeline
#  Builds all three services → Artifact Registry → Cloud Run
# ============================================================

steps:
  # ----------------------------------------------------------
  # 1. Build & Push Node.js API
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-node-api"
    args:
      - "build"
      - "-t"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-api:$SHORT_SHA"
      - "-t"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-api:latest"
      - "./backend/node"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-node-api"
    args:
      - "push"
      - "--all-tags"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-api"

  # ----------------------------------------------------------
  # 2. Build & Push Python OCR
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-python-ocr"
    args:
      - "build"
      - "-t"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-ocr:$SHORT_SHA"
      - "-t"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-ocr:latest"
      - "./backend/python"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-python-ocr"
    args:
      - "push"
      - "--all-tags"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-ocr"

  # ----------------------------------------------------------
  # 3. Build & Push Frontend
  # ----------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    args:
      - "build"
      - "-t"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-frontend:$SHORT_SHA"
      - "-t"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-frontend:latest"
      - "./frontend"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args:
      - "push"
      - "--all-tags"
      - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-frontend"

  # ----------------------------------------------------------
  # 4. Deploy Python OCR → Cloud Run
  # ----------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-ocr"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "authdoc-ocr"
      - "--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-ocr:$SHORT_SHA"
      - "--region=$_CLOUDRUN_REGION"
      - "--platform=managed"
      - "--port=8000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--allow-unauthenticated"
      - "--set-env-vars=LOG_LEVEL=INFO"

  # ----------------------------------------------------------
  # 5. Deploy Node.js API → Cloud Run
  # ----------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-api"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "authdoc-api"
      - "--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-api:$SHORT_SHA"
      - "--region=$_CLOUDRUN_REGION"
      - "--platform=managed"
      - "--port=3000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest"
      - "--update-env-vars=PYTHON_OCR_URL=http://authdoc-ocr-$_CLOUDRUN_REGION.a.run.app/extract,GEMINI_MODEL=gemini-1.5-flash,CORS_ORIGINS=https://authdoc-frontend-$_CLOUDRUN_REGION.a.run.app"

  # ----------------------------------------------------------
  # 6. Deploy Frontend → Cloud Run
  # ----------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "authdoc-frontend"
      - "--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-frontend:$SHORT_SHA"
      - "--region=$_CLOUDRUN_REGION"
      - "--platform=managed"
      - "--port=80"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--allow-unauthenticated"

images:
  - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-api:$SHORT_SHA"
  - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-api:latest"
  - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-ocr:$SHORT_SHA"
  - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-ocr:latest"
  - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-frontend:$SHORT_SHA"
  - "$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/authdoc-frontend:latest"

substitutions:
  _AR_REPO: authdoc-repo
  _AR_REGION: us-central1
  _CLOUDRUN_REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
